<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - lilbro researcher</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <h1>lilbro researcher</h1>
    <p class="muted">Placeholder auth for now — any username and password will work.</p>
    <form method="post" action="/login">
      <label>Username</label>
      <input type="text" name="username" placeholder="anything" required />
      <label>Password</label>
      <input type="password" name="password" placeholder="anything" required />
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
